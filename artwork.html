                var theme = localStorage.getItem('artsoul_theme') || 'classic';
                document.documentElement.classList.remove('classic', 'future');
                document.documentElement.classList.add(theme === 'future' ? 'future' : 'classic');
                if (/^0x[a-f0-9]{40}$/i.test(localStorage.getItem('artsoul_wallet') || '')) document.documentElement.classList.add('wallet-state-resolving');
            } catch (error) {
                document.documentElement.classList.remove('classic', 'future');
                document.documentElement.classList.add('classic');
            }
        })();
    </script>

    <style>
body.classic,
        body.future {
            background: var(--c-bg);
            color: var(--c-text);
        }

        /* Gradient flow animation for Future mode */
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .future h1,
        .future h2,
        .future h3 {
            background: linear-gradient(90deg, var(--c-accent), var(--c-accent-2), var(--c-accent));
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 3s linear infinite;
        }

        /* Logo styles */
        .classic .site-logo {
            filter: drop-shadow(0 0 8px rgba(var(--c-accent-rgb), 0.4));
        }

        .future .site-logo {
            filter: drop-shadow(0 0 15px rgba(var(--c-accent-rgb), 0.6)) drop-shadow(0 0 30px rgba(var(--c-accent-2-rgb), 0.4));
        }

        /* Input styles */
        input, textarea {
            background: transparent;
            border: 1px solid currentColor;
            color: inherit;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--c-border);
        }

        /* Glow pulse animation for Future mode */
        @keyframes glow-pulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(var(--c-accent-rgb), 0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(var(--c-accent-rgb), 0.6), 0 0 40px rgba(var(--c-accent-2-rgb), 0.4);
            }
        }

        .auction-detail-panel,
        .bid-activity-panel,
        .new-auction-panel {
            background: var(--c-surface);
            border: 1px solid var(--c-border-soft);
            color: var(--c-text);
        }

        .new-auction-input {
            width: 100%;
            background: var(--c-surface-muted);
            border: 1px solid var(--c-border-soft);
            color: var(--c-text);
        }

        .new-auction-input:focus {
            border-color: var(--c-border);
            box-shadow: 0 0 0 2px var(--c-glow);
            outline: none;
        }

        .auction-duration-option {
            background: var(--c-surface-muted);
            border: 1px solid var(--c-border-soft);
            color: var(--c-text);
        }

        .auction-duration-option.is-active {
            background: rgba(var(--c-accent-rgb), 0.14);
            border-color: var(--c-border);
            color: var(--c-accent);
            box-shadow: 0 0 14px var(--c-glow);
        }

        .live-auction-pill {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--c-border);
            background: rgba(var(--c-accent-rgb), 0.12);
            color: var(--c-accent);
        }

        .bid-activity-row {
            background: var(--c-surface-muted);
            border: 1px solid var(--c-border-soft);
        }

        .bid-activity-row + .bid-activity-row {
            margin-top: 0.5rem;
        }

        .bidder-profile-link,
        .bid-activity-amount {
            color: var(--c-accent);
        }

        .bidder-profile-link:hover,
        .bidder-profile-link:focus-visible {
            color: var(--c-accent-2);
        }

        .bid-activity-empty {
            background: rgba(var(--c-accent-rgb), 0.06);
            border: 1px dashed var(--c-border-soft);
            color: var(--c-text);
        }

        .moderation-panel {
            background: var(--c-surface);
            border: 1px solid var(--c-border-soft);
            color: var(--c-text);
        }

        .moderation-state {
            background: rgba(var(--c-accent-rgb), 0.08);
            border: 1px solid var(--c-border-soft);
            color: var(--c-accent);
        }

        .moderation-reason {
            background: var(--c-surface-muted);
            border: 1px solid var(--c-border-soft);
            color: var(--c-text);
        }

        .moderation-reason:focus {
            border-color: var(--c-border);
            box-shadow: 0 0 0 2px var(--c-glow);
        }

        .moderation-action {
            background: rgba(var(--c-accent-rgb), 0.12);
            border: 1px solid var(--c-border);
            color: var(--c-accent);
        }

        .moderation-action:hover:not(:disabled),
        .moderation-action:focus-visible:not(:disabled) {
            background: rgba(var(--c-accent-rgb), 0.2);
            box-shadow: 0 0 18px var(--c-glow);
        }

        .moderation-action:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
    </style>

                    <a href="/gallery#discover">Explore</a>
                    <a href="/upload">Create</a>
                    <a href="/docs-protocol">Guide</a>
                </nav>
                <div class="site-header-actions">
                    <div id="networkBadge"></div>
                    <button type="button" class="site-search-button" data-artsoul-search aria-label="Search ArtSoul" title="Search ArtSoul (Ctrl K)" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
                    </button>
                    <button type="button" class="artsoul-voice-button" aria-label="ArtSoul commands" title="Text and voice commands" aria-haspopup="dialog" aria-controls="artsoulVoicePanel" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg></button>
                    <div id="header-notifications">
                        <section class="notification-inbox header-notification-inbox" aria-label="Your notifications">
                            <button type="button" class="notification-toggle" data-notification-preview data-allow-rapid="true" title="Notifications" aria-label="Notifications" aria-controls="notification-preview-panel" popovertarget="notification-preview-panel" onclick="const host=this.closest('#header-notifications');if(host.dataset.notificationWallet&&!document.getElementById('notification-preview-panel').matches(':popover-open'))host.dataset.notificationRequested=host.dataset.notificationWallet;else delete host.dataset.notificationRequested">
                                <span class="notification-toggle-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"></path><path d="M10 21h4"></path></svg></span>
                            </button>
                        <div id="notification-preview-panel" class="notification-panel" popover="auto" role="region" aria-labelledby="notification-preview-title">
                                <div class="notification-panel-heading">
                                    <h2 id="notification-preview-title">Notifications</h2>
                                    <button type="button" class="notification-close" data-allow-rapid="true" popovertarget="notification-preview-panel" popovertargetaction="hide" aria-label="Close notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"></path></svg></button>
                                </div>
                                <p class="notification-help" data-notification-message>Connect your wallet to see bids, auction results and other updates.</p>
                                <button type="button" class="btn-secondary" data-notification-connect data-allow-rapid="true">Connect wallet</button>
                            </div>
                        </section>
                    </div>
                    <div id="navButtons" class="site-header-nav" data-avatar-render-key="initializing">
                        <div class="avatar-dropdown-container">
                            <button class="avatar-button" type="button" data-allow-rapid aria-label="ArtSoul account menu" aria-controls="avatarDropdownMenu" aria-expanded="false" onclick="window.AvatarDropdown?.toggle()">
                                <img data-avatar-image src="/default-avatar.png" alt="ArtSoul" loading="eager" decoding="sync">
                                <div class="avatar-info"><div data-avatar-name>ArtSoul Guest</div><div data-avatar-address hidden aria-hidden="true"></div><div data-avatar-resolving aria-hidden="true">Connecting…</div></div>
                                <svg width="16" height="16" viewBox="0 0 16 16" class="dropdown-arrow menu-chevron" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script>window.ArtSoulHeaderPrepaint?.hydrate(document.getElementById('navButtons'));</script>
    <div id="app">
        <div class="artwork-page-root" data-artwork-static-skeleton>
            <main class="artsoul-wait-stage">
                <div class="artsoul-wait" role="status" aria-label="Loading artwork" aria-busy="true" aria-live="polite">
                    <div class="artsoul-wait-mark" aria-hidden="true">
                        <span class="artsoul-wait-word">ArtSoul</span>
                        <span class="artsoul-wait-dots">
                            <span class="artsoul-wait-dot"></span>
                            <span class="artsoul-wait-dot"></span>
                            <span class="artsoul-wait-dot"></span>
                        </span>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <template id="artworkEntryFailure">
        <div class="min-h-screen">
            <main class="min-h-[60vh] flex items-center justify-center">
                <div class="text-center max-w-md mx-auto px-4" role="alert">
                    <div class="text-2xl mb-4">Artwork could not start</div>
                    <div class="text-base mb-6 opacity-75">The page module did not load. Check your connection and try again.</div>
                    <div class="flex gap-4 justify-center">
                        <a href="/gallery" class="btn-main">Explore Art</a>
                        <button type="button" class="btn-secondary" onclick="window.location.reload()">Retry</button>
                    </div>
                </div>
            </main>
        </div>
    </template>
    <script>
        (() => {
            const app = document.getElementById('app');
            const failure = document.getElementById('artworkEntryFailure');
            let timeoutId;
            const showFailure = () => {
                if (!app || app.dataset.artworkEntryMounted === 'true' || !failure) return;
                app.replaceChildren(failure.content.cloneNode(true));
            };
            window.ArtSoulArtworkEntryFailed = showFailure;
            window.addEventListener('artsoul:artwork-entry-mounted', () => clearTimeout(timeoutId), { once: true });
            timeoutId = window.setTimeout(showFailure, 15000);
        })();
    </script>
    <script type="module" src="/src/entries/artwork.jsx" onerror="window.ArtSoulArtworkEntryFailed?.()"></script>
    <script>
        window.addEventListener('load', () => {
            if (window.StatusBannerSystem) {
                window.statusBanners = new StatusBannerSystem();
                console.log('🚦 Status Banners ready');
            }
        });
    </script>
