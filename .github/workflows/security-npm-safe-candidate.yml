name: npm safe remediation candidate

on:
  push:
    branches:
      - security/npm-71-inventory-20261121
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: artsoul-security-fix-proposal
  cancel-in-progress: true

jobs:
  safe-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Pin npm 11.6.2
        run: npm install -g npm@11.6.2 --no-audit --no-fund

      - name: Generate a lockfile-only candidate (runner only)
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json npm-audit-original-lock.json
          npm audit --package-lock-only --json > npm-audit-before-full.json || true
          npm audit --package-lock-only --omit=dev --json > npm-audit-before-prod.json || true
          npm audit fix --package-lock-only --ignore-scripts --no-fund --json > npm-audit-fix-proposal.json || true
          npm audit --package-lock-only --json > npm-audit-after-full.json || true
          npm audit --package-lock-only --omit=dev --json > npm-audit-after-prod.json || true
          git diff -- package-lock.json > npm-audit-candidate.diff
          if git diff --name-only | grep -v '^package-lock.json$'; then
            echo "ABORT: npm changed a source file other than package-lock.json" >&2
            exit 1
          fi
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            for(const file of ["npm-audit-before-full.json","npm-audit-after-full.json","npm-audit-before-prod.json","npm-audit-after-prod.json"]){
              const j=JSON.parse(readFileSync(file,"utf8"));
              if(!j.metadata?.vulnerabilities || j.error)throw Error("invalid_audit_"+file);
              console.log(file,JSON.stringify(j.metadata.vulnerabilities));
            }
          '
          git diff --stat

      - name: Commit only compatible lockfile changes to isolated security branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/security/npm-71-inventory-20261121" ]; then
            echo "Ref outside isolated security branch: stopping."
            exit 0
          fi
          if git diff --quiet -- package-lock.json; then
            echo "No compatible lockfile changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git commit -m "fix(security): apply npm-compatible lockfile advisory updates"
          git push origin HEAD:refs/heads/security/npm-71-inventory-20261121

      - name: Downloadable candidate and evidence (not committed)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artsoul-npm-safe-candidate
          path: |
            npm-audit-original-lock.json
            npm-audit-before-full.json
            npm-audit-before-prod.json
            npm-audit-fix-proposal.json
            npm-audit-after-full.json
            npm-audit-after-prod.json
            npm-audit-candidate.diff
            package-lock.json
          if-no-files-found: error
          retention-days: 14
