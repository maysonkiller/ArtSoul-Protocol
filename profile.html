<script>
        (function() {
            try {
                var theme = localStorage.getItem('artsoul_theme') || 'classic';
                document.documentElement.classList.remove('classic', 'future');
                document.documentElement.classList.add(theme === 'future' ? 'future' : 'classic');
                if (/^0x[a-f0-9]{40}$/i.test(localStorage.getItem('artsoul_wallet') || '')) document.documentElement.classList.add('wallet-state-resolving');
            } catch (error) {
                document.documentElement.classList.remove('classic', 'future');
                document.documentElement.classList.add('classic');
            }
        })();
    </script>

    <style>
* {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes glow-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fadeIn {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .gallery-item {
            transition: all 0.3s ease;
        }

        /* Classic Mode */
        body.classic {
            background: var(--bg-classic);
            color: var(--text-classic);
        }

        /* Button styles moved to unified-styles.css */

        .classic .gallery-item:hover {
            transform: translateY(-8px);
            border-color: var(--accent-classic);
        }

        /* Future Mode */
        body.future {
            background: var(--c-bg);
            color: var(--accent-future);
        }

        /* Button hover effects moved to button-effects.css */

        .future .neon-glow {
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 30px currentColor;
            animation: glow-pulse 2s ease-in-out infinite;
        }

        .future .neon-border {
            box-shadow: 0 0 10px var(--accent-future), 0 0 20px var(--accent-future);
        }

        .future .gallery-item:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 0 15px var(--neon-purple), 0 0 30px var(--neon-purple);
        }

        /* Theme toggle styles moved to unified-styles.css */

/* Username gradient in Future mode */
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .future .avatar-info > div:first-child {
            background: linear-gradient(90deg, var(--accent-future), var(--neon-purple), var(--accent-future));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 3s linear infinite;
        }
    </style>

                </div>
                <nav class="site-header-center page-context site-primary-nav" aria-label="Main navigation">

                    <a href="/upload">Create</a>
                    <a href="/docs-protocol" aria-label="How it works"><span class="site-nav-guide-long">How it works</span><span class="site-nav-guide-short" aria-hidden="true">Guide</span></a>

                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
                    </button>
                    <button type="button" class="artsoul-voice-button" aria-label="ArtSoul commands" title="Text and voice commands" aria-haspopup="dialog" aria-controls="artsoulVoicePanel" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg></button>
                    <div id="header-notifications">
                        <section class="notification-inbox header-notification-inbox" aria-label="Your notifications">
                            <button type="button" class="notification-toggle" data-notification-preview data-allow-rapid="true" title="Notifications" aria-label="Notifications" aria-controls="notification-preview-panel" popovertarget="notification-preview-panel" onclick="const host=this.closest('#header-notifications');if(host.dataset.notificationWallet&&!document.getElementById('notification-preview-panel').matches(':popover-open'))host.dataset.notificationRequested=host.dataset.notificationWallet;else delete host.dataset.notificationRequested">

                                <div class="avatar-info"><div data-avatar-name>ArtSoul Guest</div><div data-avatar-address hidden aria-hidden="true"></div><div data-avatar-resolving aria-hidden="true">Connecting…</div></div>

    <script>window.ArtSoulHeaderPrepaint?.hydrate(document.getElementById('navButtons'));</script>
    <div id="app"></div>
    <template id="profileInitialSkeleton">
        <div class="min-h-screen" data-profile-static-skeleton>
            <main class="artsoul-wait-stage">
                <div class="artsoul-wait" role="status" aria-label="Loading profile" aria-busy="true" aria-live="polite">
                    <div class="artsoul-wait-mark" aria-hidden="true">
                        <span class="artsoul-wait-word">ArtSoul</span>
                        <span class="artsoul-wait-dots">
                            <span class="artsoul-wait-dot"></span>
                            <span class="artsoul-wait-dot"></span>
                            <span class="artsoul-wait-dot"></span>
                        </span>
                    </div>
                </div>
            </main>
        </div>
    </template>
    <script>
        (() => {
            const app = document.getElementById('app');
            const template = document.getElementById('profileInitialSkeleton');
            const viewAddress = new URLSearchParams(window.location.search).get('address') || '';
            let walletHint = '';
            try {
                walletHint = localStorage.getItem('artsoul_wallet') || '';
            } catch {
                walletHint = '';
            }
            if (app && template && /^0x[a-f0-9]{40}$/i.test(viewAddress || walletHint)) {
                app.appendChild(template.content.cloneNode(true));
            }
        })();
    </script>
    <template id="profileEntryFailure">
        <main class="site-page-container py-12">
            <section class="profile-connect-state max-w-xl mx-auto p-8 text-center" role="alert">
                <h1 class="text-2xl font-semibold mb-3">Profile could not start</h1>
                <p class="text-sm opacity-70 mb-6">The page did not load. Check your connection and try again.</p>
                <button type="button" class="btn-secondary" onclick="window.location.reload()">Retry</button>
            </section>
        </main>
    </template>
    <script>
        (() => {
            const app = document.getElementById('app');
            const failure = document.getElementById('profileEntryFailure');
            let timeoutId;
            const showFailure = () => {
                if (!app || app.dataset.profileEntryMounted === 'true' || !failure) return;
                app.replaceChildren(failure.content.cloneNode(true));
            };
            window.ArtSoulProfileEntryFailed = showFailure;
            window.addEventListener('artsoul:profile-entry-mounted', () => clearTimeout(timeoutId), { once: true });
            timeoutId = window.setTimeout(showFailure, 15000);
        })();
    </script>
    <script type="module" src="/src/entries/profile.jsx" onerror="window.ArtSoulProfileEntryFailed?.()"></script>
